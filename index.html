<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f0e6">
<meta name="robots" content="noindex">
<title>Judging AI answers: a research study</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand"><img id="logo" src="assets/hnu-logo.png" alt="Hochschule Neu-Ulm" hidden><span id="brand">Research study</span></div>
  <div id="lang" class="lang" role="group" aria-label="Language"><button type="button" data-l="en" lang="en" title="English">EN</button><button type="button" data-l="de" lang="de" title="Deutsch">DE</button></div>
  <div class="prog" id="prog" hidden><span id="progress"></span><div id="bar" class="bar" hidden><i id="barfill"></i></div></div>
</header>
<main id="app"></main>
<footer class="foot"><span id="foot-text">Master’s thesis study · Hochschule Neu-Ulm</span> · <a id="mail" href="#"></a></footer>

<div id="reader" class="reader" hidden>
  <div class="reader-box" role="dialog" aria-modal="true" aria-labelledby="reader-title">
    <div class="reader-head"><div><div id="reader-title" class="reader-title"></div><div id="reader-origin" class="muted"></div></div>
      <button id="reader-close" class="btn">Close source</button></div>
    <div id="reader-scroll" class="reader-scroll"><div id="reader-text" class="reader-text"></div>
      <a id="reader-link" class="reader-link" target="_blank" rel="noopener noreferrer" href="#" hidden></a></div>
  </div>
</div>

<script src="config.js"></script>
<script>document.getElementById("logo").hidden = !CONFIG.SHOW_LOGO; (function (m) { m.textContent = CONFIG.EMAIL; m.href = "mailto:" + CONFIG.EMAIL; })(document.getElementById("mail"));</script>
<script src="i18n.js"></script>
<script src="items.js"></script>
<script src="design.js"></script>
<script src="app.js"></script>
</body>
</html>
