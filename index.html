<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Judging AI answers: a research study</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand"><img id="logo" src="assets/hnu-logo.png" alt="Hochschule Neu-Ulm" hidden><span>Research study</span></div>
  <div class="prog"><span id="progress"></span><div id="bar" class="bar" hidden><i id="barfill"></i></div></div>
</header>
<main id="app"></main>
<footer class="foot">Master’s thesis study · Hochschule Neu-Ulm · <a id="mail" href="#"></a></footer>

<div id="reader" class="reader" hidden>
  <div class="reader-box" role="dialog" aria-modal="true" aria-labelledby="reader-title">
    <div class="reader-head"><div><div id="reader-title" class="reader-title"></div><div id="reader-origin" class="muted"></div></div>
      <button id="reader-close" class="btn">Close source</button></div>
    <div id="reader-text" class="reader-text"></div>
  </div>
</div>

<script src="config.js"></script>
<script>document.getElementById("logo").hidden = !CONFIG.SHOW_LOGO; (function (m) { m.textContent = CONFIG.EMAIL; m.href = "mailto:" + CONFIG.EMAIL; })(document.getElementById("mail"));</script>
<script src="items.js"></script>
<script src="design.js"></script>
<script src="app.js"></script>
</body>
</html>
