<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Study admin</title>
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="admin.css">
</head>
<body>
<header class="top"><div class="brand"><img src="assets/hnu-logo.png" alt="Hochschule Neu-Ulm"><span>Study admin</span></div><span id="who"></span></header>
<nav id="tabs" hidden>
  <button data-tab="overview" class="on">Overview</button><button data-tab="responses">Responses</button>

</nav>
<main id="admin"></main>
